<!DOCTYPE html>
<html>
<head>
<title>学校ポータル</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>学校ポータルサイト</h1>
</header>

<div class="container">

<div id="loginArea">

<h2>ログイン</h2>

<input id="loginUser" placeholder="ユーザー名">
<input id="loginPass" type="password" placeholder="パスワード">

<button onclick="login()">ログイン</button>

<h2>新規登録</h2>

<input id="regUser" placeholder="ユーザー名">
<input id="regPass" type="password" placeholder="パスワード">

<button onclick="register()">登録</button>

</div>


<div id="boardArea" style="display:none">

<h2 id="welcome"></h2>

<button onclick="logout()">ログアウト</button>

<h3>掲示板</h3>

<textarea id="postText"></textarea>

<button onclick="addPost()">投稿</button>

<div id="posts"></div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
