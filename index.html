<!DOCTYPE html>
<html>
<head>
<title>学校サイト</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>〇〇学校ポータル</h1>
</header>

<div class="container">

<!-- ログイン -->
<div id="loginArea">
<h2>ログイン</h2>

<input id="username" placeholder="ユーザー名">
<input id="password" type="password" placeholder="パスワード">

<button onclick="login()">ログイン</button>
</div>

<!-- 掲示板 -->
<div id="boardArea" style="display:none">

<h2>学校掲示板</h2>

<textarea id="postText" placeholder="投稿を書く"></textarea>
<button onclick="addPost()">投稿</button>

<h3>投稿一覧</h3>

<div id="posts"></div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
