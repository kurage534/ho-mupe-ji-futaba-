<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>学校ポータル - ダッシュボード</title>

<link rel="stylesheet" href="css/style.css">

<style>
body{
font-family: Arial;
margin:0;
background:#eef3f8;
}

header{
background:#2c3e50;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

nav{
background:#34495e;
padding:10px;
}

nav a{
color:white;
margin-right:15px;
text-decoration:none;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:8px;
box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

button{
padding:8px 12px;
border:none;
background:#3498db;
color:white;
border-radius:4px;
cursor:pointer;
}

button:hover{
background:#2980b9;
}

textarea{
width:100%;
height:80px;
margin-top:10px;
}
</style>

</head>

<body>

<header>

<h2>🎓 学校ポータル</h2>

<div>
<span id="userEmail"></span>
<button onclick="logout()">ログアウト</button>
</div>

</header>

<nav>

<a href="#">ダッシュボード</a>
<a href="#">掲示板</a>
<a href="#">時間割</a>
<a href="#">行事予定</a>

</nav>

<div class="container">

<div class="card">

<h3>📢 お知らせ</h3>

<ul>
<li>文化祭は9月20日です</li>
<li>テスト期間は来週です</li>
<li>体育祭の練習が始まります</li>
</ul>

</div>


<div class="card">

<h3>💬 掲示板</h3>

<textarea id="postText" placeholder="投稿を書く"></textarea>

<br><br>

<button onclick="post()">投稿</button>

<div id="posts"></div>

</div>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import { getFirestore, collection, addDoc, getDocs }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


const firebaseConfig = {
apiKey: "APIKEY",
authDomain: "PROJECT.firebaseapp.com",
projectId: "PROJECT",
};

const app = initializeApp(firebaseConfig);

const auth = getAuth();
const db = getFirestore();


onAuthStateChanged(auth,(user)=>{

if(user){

document.getElementById("userEmail").innerText=user.email;

loadPosts();

}else{

location.href="index.html";

}

});


async function post(){

const text=document.getElementById("postText").value;

await addDoc(collection(db,"posts"),{

message:text,
date:new Date()

});

document.getElementById("postText").value="";

loadPosts();

}


async function loadPosts(){

const querySnapshot=await getDocs(collection(db,"posts"));

let html="";

querySnapshot.forEach((doc)=>{

html += "<div>"+doc.data().message+"</div>";

});

document.getElementById("posts").innerHTML=html;

}


window.logout=function(){

signOut(auth);

}

</script>

</body>
</html>
